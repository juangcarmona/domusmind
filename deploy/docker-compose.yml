services:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       domusmind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d domusmind"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Postgres is intentionally not exposed on a host port.
    # Access through the domusmind service only.

  ollama:
    image: ollama/ollama:0.40.6
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  ollama-model:
    image: ollama/ollama:0.40.6
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull llama3.2:3b"]
    restart: "no"

  domusmind:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-juangcarmona}/domusmind:${VERSION:-edge}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__domusmind: "Host=postgres;Database=domusmind;Username=${DB_USER};Password=${DB_PASSWORD}"
      Inbox__Interpreter__Provider: ${INBOX_INTERPRETER_PROVIDER:-Ollama}
      Inbox__Interpreter__Endpoint: ${INBOX_INTERPRETER_ENDPOINT:-}
      Inbox__Interpreter__Model: ${INBOX_INTERPRETER_MODEL:-}
      Inbox__Interpreter__ApiKey: ${INBOX_INTERPRETER_API_KEY:-}
      OLLAMA_LLAMA3_2_URI: http://ollama:11434
      OLLAMA_LLAMA3_2_MODEL: llama3.2:3b
      Jwt__SigningKey: ${JWT_SECRET}
      Jwt__Issuer:    ${JWT_ISSUER:-domusmind}
      Jwt__Audience:  ${JWT_AUDIENCE:-${JWT_ISSUER:-domusmind}}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      ReverseProxy__KnownProxies: ${REVERSE_PROXY_KNOWN_PROXIES:-}
      ReverseProxy__KnownIPNetworks: ${REVERSE_PROXY_KNOWN_IP_NETWORKS:-}
      ReverseProxy__AllowedHosts: ${REVERSE_PROXY_ALLOWED_HOSTS:-}
      MicrosoftGraph__ClientId: ${MICROSOFT_GRAPH_CLIENT_ID:-}
      MicrosoftGraph__ClientSecret: ${MICROSOFT_GRAPH_CLIENT_SECRET:-}
      MicrosoftGraph__TenantId: ${MICROSOFT_GRAPH_TENANT_ID:-common}
      MicrosoftGraph__TokenEncryptionKey: ${MICROSOFT_GRAPH_TOKEN_ENCRYPTION_KEY:-}
      MicrosoftGraph__AllowedRedirectUris__0: ${MICROSOFT_GRAPH_REDIRECT_URI:-}
      # First-run bootstrap admin - disable after initial setup.
      # BootstrapAdmin__Enabled:     true
      # BootstrapAdmin__Email:        ${BOOTSTRAP_ADMIN_EMAIL}
      # BootstrapAdmin__Password:     ${BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "${APP_PORT:-24365}:8080"

volumes:
  postgres_data:
  ollama_data:
