name: product-ci

# Verifies the product model under docs/product and the ProductShape
# installation. See the note in backend-ci.yml: no path filter on
# pull_request, gated on `changes` instead, so the check always reports.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'docs/product/**'
      - '.product/**'
      - 'openspec/**'
      - '.claude/skills/**'
      - '.claude/commands/product/**'
      - '.claude/hooks/**'
      - '.github/workflows/product-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: product changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Detect relevant changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --paginate --jq '.[].filename')
          echo "$files"
          if printf '%s\n' "$files" | grep -qE '^(docs/product/|\.product/|openspec/|\.claude/(skills|commands/product|hooks)/|\.github/workflows/product-ci\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: product model
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # `integration update --check` inspects the OpenSpec integration through
      # the OpenSpec CLI, so it has to be on the path.
      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1

      - name: Validate the product model
        run: npx -y @prodshape/cli@0.22.0 validate

      - name: Verify the managed integration files
        run: npx -y @prodshape/cli@0.22.0 integration update --check

      # Every current OpenSpec document must be bound to the model with current
      # citations, or exempt with a human-approved reason.
      - name: Verify OpenSpec citations
        run: npx -y @prodshape/cli@0.22.0 citations verify --provider openspec
