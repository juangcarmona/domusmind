name: product-ci

# Verifies the product model under docs/product and the ProductShape
# installation. See the note in backend-ci.yml: no path filter on
# pull_request, gated on `changes` instead, so the check always reports.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'docs/product/**'
      - '.product/**'
      - '.claude/**'
      - '.agents/**'
      - 'openspec/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/product-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: product changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Detect relevant changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --paginate --jq '.[].filename')
          echo "$files"
          if grep -qE '^(package(-lock)?\.json$|docs/product/|\.product/|\.claude/|\.agents/|openspec/|\.github/workflows/product-ci\.yml$)' <<< "$files"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: product model
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install engineering tools
        run: npm ci --ignore-scripts

      - name: Validate OpenSpec specifications
        run: npx --no-install openspec validate --all

      - name: Validate the product model
        run: npx --no-install prodshape validate

      - name: Validate active Product Change overlays
        run: npx --no-install prodshape change validate

      - name: Verify ProductShape integration integrity
        run: npx --no-install prodshape integration update --check

      # Every current OpenSpec document must be bound to the model with current
      # citations, or exempt with a human-approved reason.
      - name: Verify OpenSpec citations
        run: npx --no-install prodshape citations verify --provider openspec

      - name: Verify configured product citation consumers
        run: npx --no-install prodshape citations verify

      - name: Build the Product Explorer
        run: npm run product:build
