name: engineering-site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/engineering-site.yml'
      - 'tools/engineering-site/**'
      - 'tools/static-site/**'
      - 'tools/arc42-snapshot/**'
      - 'scripts/build-architecture-site.mjs'
      - 'scripts/check-architecture-site.mjs'
      - 'scripts/architecture-diagrams.mjs'
      - 'scripts/architecture-diagrams.test.mjs'
      - 'tools/e2e-report/**'
      - 'src/web/app/e2e/**'
      - 'src/web/app/playwright.config.ts'
      - 'src/web/app/package.json'
      - 'src/web/app/package-lock.json'
      - 'docs/architecture/**'
      - 'docs/adr/**'
      - 'docs/product/model/**'
      - '.product/config.yaml'
      - 'docs/engineering-site.md'
      - 'docs/engineering-e2e.md'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

# Every published update restores the current site before replacing its own
# sections. Keep a single publisher active so two runs cannot overwrite one
# another's manifest and generated pages.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('engineering-site-pr-{0}', github.event.pull_request.number) || 'domusmind-engineering-site' }}
  cancel-in-progress: false

jobs:
  changes:
    name: engineering site changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Detect relevant changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
          echo "$files"
          if printf '%s\n' "$files" | grep -qE '^(\.github/workflows/engineering-site\.yml$|tools/(engineering-site|static-site|arc42-snapshot|e2e-report)/|scripts/((build|check)-architecture-site|architecture-diagrams(\.test)?)\.mjs$|src/web/app/(e2e/|playwright\.config\.ts$|package(-lock)?\.json$)|docs/(architecture|adr|product/model)/|\.product/config\.yaml$|docs/engineering-(site|e2e)\.md$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-gate:
    name: E2E run gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Skip a scheduled run already reported for this commit
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_SHA: ${{ github.sha }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/e2e/latest.json
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          reported_sha=$(curl --silent --show-error --fail "$REPORT_URL" | jq -r '.commitSha // empty' || true)
          if [ "$reported_sha" = "$CURRENT_SHA" ]; then
            echo "The current main commit already has a published browser report."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: Browser journeys
    needs: e2e-gate
    if: needs.e2e-gate.outputs.run == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: domusmind
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: domusmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domusmind -d domusmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    outputs:
      report_available: ${{ steps.report.outputs.available }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/app/package-lock.json

      - name: Restore and build the API
        run: |
          dotnet restore src/backend/DomusMind.Api/DomusMind.Api.csproj
          dotnet build src/backend/DomusMind.Api/DomusMind.Api.csproj --no-restore --configuration Release

      - name: Install and build the web app
        run: npm ci && npm run build
        working-directory: src/web/app

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: src/web/app

      - name: Validate report generation logic
        run: node tools/e2e-report/report.test.mjs

      - name: Start the API and web app with a deterministic interpreter
        run: |
          nohup node tools/e2e/mock-inbox-interpreter.mjs > /tmp/domusmind-e2e-interpreter.log 2>&1 &
          nohup env ASPNETCORE_URLS=http://127.0.0.1:52250 ConnectionStrings__domusmind='Host=127.0.0.1;Port=5432;Database=domusmind;Username=domusmind;Password=e2e-local-only' Jwt__SigningKey='e2e-run-only-signing-key-never-used-outside-this-job' Inbox__Interpreter__Provider=OpenAICompatible Inbox__Interpreter__Endpoint=http://127.0.0.1:39002/v1/chat/completions Inbox__Interpreter__Model=domusmind-e2e dotnet run --project src/backend/DomusMind.Api/DomusMind.Api.csproj --no-build --no-launch-profile --configuration Release > /tmp/domusmind-e2e-api.log 2>&1 &
          nohup env API_HTTP=http://127.0.0.1:52250 npm --prefix src/web/app run dev -- --host 127.0.0.1 --port 61546 --strictPort > /tmp/domusmind-e2e-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:39002/health > /dev/null && curl --silent --fail http://127.0.0.1:52250/api/setup/status > /dev/null && curl --silent --fail http://127.0.0.1:61546/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/domusmind-e2e-api.log
          cat /tmp/domusmind-e2e-web.log
          cat /tmp/domusmind-e2e-interpreter.log
          exit 1

      - name: Run the selected browser journeys
        run: npm run test:e2e
        working-directory: src/web/app
        env:
          CI: 'true'
          PLAYWRIGHT_JSON: ${{ github.workspace }}/playwright-results/results.json
          PLAYWRIGHT_REPORT_DIR: ${{ github.workspace }}/playwright-results/html
          PLAYWRIGHT_OUTPUT_DIR: ${{ github.workspace }}/playwright-results/evidence
          E2E_BASE_URL: http://127.0.0.1:61546

      - name: Prepare a report, including missing-evidence failures
        id: report
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p e2e-report playwright-results/html playwright-results/evidence
          echo "available=true" >> "$GITHUB_OUTPUT"
          created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n --arg commitSha "$COMMIT_SHA" --arg runId "$RUN_ID" --arg runUrl "$RUN_URL" --arg createdAt "$created_at" '{commitSha:$commitSha,runId:$runId,runUrl:$runUrl,createdAt:$createdAt}' > /tmp/domusmind-e2e-metadata.json
          node tools/e2e-report/report.mjs prepare playwright-results/results.json playwright-results/html playwright-results/evidence e2e-report /tmp/domusmind-e2e-metadata.json

      - name: Save the report and raw evidence for recovery
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ github.run_id }}
          path: e2e-report
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build Engineering site
    needs: [changes, e2e]
    if: always() && needs.changes.outputs.relevant == 'true' && (needs.e2e.result == 'success' || needs.e2e.result == 'failure' || needs.e2e.result == 'skipped')
    # Raccord's working static-site publisher uses this runner image for
    # Puppeteer/Chromium Mermaid rendering; ubuntu-latest blocks its sandbox.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        id: pages

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install engineering tools
        run: npm ci --ignore-scripts

      - name: Test site generation utilities
        run: |
          node --check tools/static-site/static-site.mjs
          node tools/static-site/static-site.test.mjs
          node tools/e2e-report/report.test.mjs

      - name: Install Chromium for offline Mermaid rendering
        run: npx --no-install puppeteer browsers install chrome

      - name: Restore current Pages sections
        if: github.event_name != 'pull_request'
        run: node tools/static-site/static-site.mjs restore "${{ steps.pages.outputs.base_url }}" _site

      - name: Download the current E2E report, including failure evidence
        if: needs.e2e.outputs.report_available == 'true'
        uses: actions/download-artifact@v6
        with:
          name: e2e-report-${{ github.run_id }}
          path: e2e-report

      - name: Add the report and prune to the retention window
        if: needs.e2e.outputs.report_available == 'true'
        run: node tools/e2e-report/report.mjs publish _site e2e-report "${{ github.run_id }}-${{ github.sha }}" 14

      - name: Build Engineering landing page
        run: node tools/static-site/static-site.mjs build _site "${{ steps.pages.outputs.base_url }}"

      - name: Generate ArcShape architecture reader
        run: |
          node scripts/architecture-diagrams.test.mjs
          node scripts/architecture-diagrams.mjs --check
          node scripts/build-architecture-site.mjs "$GITHUB_WORKSPACE/_site/architecture/index.html" "${{ github.sha }}"
          node scripts/check-architecture-site.mjs "$GITHUB_WORKSPACE/_site/architecture/index.html"

      - name: Generate ProductShape snapshot
        run: |
          npx -y @prodshape/cli@0.22.0 graph --format html
          mkdir -p _site/model
          cp .product/generated/snapshot.html _site/model/index.html

      - name: Finalize the site manifest
        run: node tools/static-site/static-site.mjs finalize _site

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish Engineering site
    needs: build
    if: always() && github.event_name != 'pull_request' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
