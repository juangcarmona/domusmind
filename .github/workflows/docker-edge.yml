name: docker-edge

# Publishes a commit-addressed image after every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-edge
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GHCR requires lowercase image names; repository_owner may be mixed-case.
      - name: Normalise image names
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "DOMUSMIND_IMAGE=ghcr.io/${OWNER}/domusmind" >> "$GITHUB_ENV"

      - name: Generate commit version metadata
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          release_date="$(date -u +%Y-%m-%d)"
          printf '%s\n' \
            "export const APP_VERSION = \"build-${short_sha}\";" \
            "export const APP_RELEASE_DATE = \"${release_date}\";" \
            "export const APP_COMMIT_SHA = \"${GITHUB_SHA}\";" \
            'export const APP_IS_PRERELEASE = true;' \
            > src/web/app/src/generated/version.ts

      - name: Build and push DomusMind image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/backend/DomusMind.Api/Dockerfile
          build-args: |
            DOMUSMIND_VERSION=build-${{ github.sha }}
            DOMUSMIND_COMMIT=${{ github.sha }}
          push: true
          tags: |
            ${{ env.DOMUSMIND_IMAGE }}:edge
            ${{ env.DOMUSMIND_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=build-${{ github.sha }}
          cache-from: type=gha,scope=domusmind
          cache-to:   type=gha,scope=domusmind,mode=max

      - name: Record published image
        run: |
          echo "Image: \`${DOMUSMIND_IMAGE}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit tag: \`${DOMUSMIND_IMAGE}:sha-${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install Aspire CLI
        run: |
          dotnet tool install --global Aspire.Cli --version 13.6.1
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate installation bundle with Aspire
        env:
          Image__Tag: sha-${{ github.sha }}
        run: |
          aspire publish --apphost src/backend/DomusMind.Deployment/DomusMind.Deployment.csproj \
            --environment Production --non-interactive --nologo \
            --output-path "$RUNNER_TEMP/domusmind-distribution"
          cp deploy/README-aspire.md "$RUNNER_TEMP/domusmind-distribution/README.md"
          mv "$RUNNER_TEMP/domusmind-distribution/.env" "$RUNNER_TEMP/domusmind-distribution/env.example"
          DB_USER=ci DB_PASSWORD=ci JWT_SECRET=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            docker compose --file "$RUNNER_TEMP/domusmind-distribution/docker-compose.yaml" config --quiet

      - name: Publish commit release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: DomusMind build ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          body: |
            Image: `${{ env.DOMUSMIND_IMAGE }}@${{ steps.build.outputs.digest }}`
            This release is tied to a commit. Stable SemVer releases remain available separately.
          files: |
            ${{ runner.temp }}/domusmind-distribution/docker-compose.yaml
            ${{ runner.temp }}/domusmind-distribution/env.example
            ${{ runner.temp }}/domusmind-distribution/README.md
