# Repository-owned schema structure; authoring prompts have been removed.
name: product-recovery
version: 1
description: >-
  PDaC brownfield recovery hosted in OpenSpec. Evidence is processed in bounded, resumable rounds and converges on a draft CHG-INITIAL Product Change.
artifacts:
  - id: brief
    generates: recovery/brief.md
    description: Confirmed recovery scope, evidence authority and batch policy
    template: brief.md
    requires: []
  - id: recovery-outcome
    generates: recovery/report.md
    description: Iterative evidence recovery report and hosted CHG-INITIAL draft
    template: report.md
    requires:
      - brief
apply:
  requires:
    - recovery-outcome
